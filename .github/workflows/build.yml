name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # 打 tag 时创建 Release 并上传附件需要这个权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Package
        shell: powershell
        run: Compress-Archive -Path .\build\* -DestinationPath .\PinPeek.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PinPeek
          path: PinPeek.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PinPeek.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
